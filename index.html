<!DOCTYPE html>
<html lang="es-ES">
<!--
  Wake Up Procrastinator - v2
  No framework · No backend · localStorage only
  styles.css  → all CSS + color tokens
  app.js      → all application logic
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wake Up Procrastinator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root">
    <!-- ══════════ HEADER ══════════ -->
    <header class="app-header">
      <div class="app-brand">
        <div class="app-brand-icon">
          <i data-lucide="zap" style="width:15px;height:15px;"></i>
        </div>
        <span class="app-title">Wake Up Procrastinator</span>
      </div>
      <span class="app-tagline">Misiones de enfoque · Sin excusas</span>
    </header>
    <!-- ══════════ CONTENT GRID ══════════ -->
    <div class="app-content">
      <!-- ─── MAIN COLUMN ─── -->
      <main class="main-col">
        <!-- Stats Bar -->
        <div class="stats-bar">
          <div class="stat-cell">
            <div class="stat-cell-top">
              <span class="stat-icon"><i data-lucide="trending-up" style="width:13px;height:13px;"></i></span>
              <span class="stat-number level" id="stat-level">1</span>
            </div>
            <div class="stat-label">Nivel</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-top">
              <span class="stat-icon"><i data-lucide="star" style="width:13px;height:13px;"></i></span>
              <span class="stat-number xp" id="stat-xp">0</span>
            </div>
            <div class="stat-label">XP Total</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-top">
              <span class="stat-icon"><i data-lucide="flame" style="width:13px;height:13px;"></i></span>
              <span class="stat-number streak" id="stat-streak">0</span>
            </div>
            <div class="stat-label">Racha</div>
          </div>
        </div>
        <!-- XP Progress -->
        <div class="xp-bar">
          <div class="xp-bar-header">
            <span class="xp-bar-label">Progreso al siguiente nivel</span>
            <span class="xp-bar-value" id="xp-bar-value">0 / 100 XP</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
        </div>
        <!-- Mission Form -->
        <div class="panel">
          <div class="panel-header">
            <i data-lucide="target" style="width:13px;height:13px;color:var(--text-3)"></i>
            <span class="panel-title">Nueva misión</span>
          </div>
          <div class="panel-body">
            <input
              type="text"
              class="text-input"
              id="mission-input"
              placeholder="¿En qué te vas a enfocar?"
              maxlength="50"
              autocomplete="off"
              spellcheck="false"
            >
            <div class="char-counter" id="char-count">0 / 50</div>
            <div class="form-sub-label">Duración</div>
            <div class="duration-grid">
              <button class="dur-btn active" data-duration="10">10 min</button>
              <button class="dur-btn"        data-duration="15">15 min</button>
              <button class="dur-btn"        data-duration="25">25 min</button>
              <button class="dur-btn"        data-duration="custom">Otra</button>
            </div>
            <div class="custom-row" id="custom-row">
              <input
                type="number"
                class="custom-input"
                id="custom-input"
                placeholder="30"
                min="1"
                max="180"
              >
              <span class="custom-hint">minutos (1–180)</span>
            </div>
            <div class="inline-msg" id="inline-msg" role="status" aria-live="polite">
              <i data-lucide="alert-triangle" style="width:14px;height:14px;flex-shrink:0;"></i>
              <span id="inline-msg-text"></span>
            </div>
            <button class="btn-start" id="start-btn">
              <i data-lucide="play" style="width:15px;height:15px;"></i>
              Empezar misión
            </button>
          </div>
        </div>
        <!-- Active Timer (hidden by default) -->
        <div class="timer-panel" id="timer-panel" hidden>
          <div class="timer-mission-name" id="timer-mission-name"></div>
          <div class="ring-container">
            <svg class="ring-svg" viewBox="0 0 170 170" aria-hidden="true">
              <circle class="ring-track"    cx="85" cy="85" r="77"></circle>
              <circle class="ring-progress" cx="85" cy="85" r="77" id="ring-progress"></circle>
            </svg>
            <div class="ring-inner">
              <div class="timer-digits" id="timer-digits">00:00</div>
              <div class="timer-sub">restantes</div>
            </div>
          </div>
          <button class="btn-abandon" id="abandon-btn">
            <i data-lucide="x" style="width:14px;height:14px;"></i>
            Abandonar misión
          </button>
        </div>
        <!-- Completion Panel (hidden by default) -->
        <div class="completion-panel" id="completion-panel" hidden>
          <button class="btn-complete" id="complete-btn">
            <i data-lucide="check-circle" style="width:18px;height:18px;"></i>
            Misión completada — ¡Reclamar recompensa!
          </button>
        </div>
        <!-- History -->
        <div class="panel">
          <div class="panel-header">
            <i data-lucide="clock" style="width:13px;height:13px;color:var(--text-3)"></i>
            <span class="panel-title">Historial</span>
          </div>
          <div class="panel-body" style="padding:0;">
            <ul class="history-list" id="history-list"></ul>
          </div>
        </div>
      </main>
      <!-- ─── MEDALS SIDEBAR ─── -->
      <aside class="medals-sidebar">
        <div class="medals-head">
          <i data-lucide="award" style="width:13px;height:13px;color:var(--text-3)"></i>
          <span class="medals-title">Logros</span>
          <span class="medals-badge" id="medals-badge">0 / 7</span>
        </div>
        <div class="medals-grid" id="medals-grid">
          <!-- Rendered by JS -->
        </div>
      </aside>
    </div>
  </div>
  <!-- Level-up banner overlay -->
  <div class="levelup-banner" id="levelup-banner" aria-hidden="true">
    <div class="levelup-banner-label">Nivel alcanzado</div>
    <div class="levelup-banner-number" id="levelup-banner-number">2</div>
    <div class="levelup-banner-sub">¡Sigue así!</div>
  </div>
  <!-- Toast container -->
  <div class="toast-wrap" id="toast-wrap"></div>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

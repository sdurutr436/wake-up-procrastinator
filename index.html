<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wake Up Procrastinator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       1. RESET & CSS VARIABLES
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Palette */
      --bg:              #07070F;
      --surface:         #0D0D1A;
      --surface-2:       #141428;
      --surface-3:       #1C1C36;
      --primary:         #7C3AED;
      --primary-light:   #A78BFA;
      --primary-glow:    rgba(124, 58, 237, 0.22);
      --accent:          #06D6A0;
      --accent-glow:     rgba(6, 214, 160, 0.18);
      --danger:          #EF4444;
      --warning:         #F59E0B;
      --gold:            #F59E0B;
      --text:            #EDEDF8;
      --text-2:          #9090B8;
      --text-3:          #555575;
      --border:          rgba(255, 255, 255, 0.06);
      --border-2:        rgba(255, 255, 255, 0.11);
      /* Radii */
      --r-sm:  6px; --r-md: 10px; --r-lg: 14px;
      /* Typography */
      --font:      'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-mono: 'SF Mono', ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    }

    /* ============================================================
       2. TYPOGRAPHY & BASE
    ============================================================ */
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      font-family: var(--font);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 15% -10%, rgba(124, 58, 237, 0.10) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 100%, rgba(6, 214, 160, 0.06) 0%, transparent 55%);
      color: var(--text);
      min-height: 100vh;
    }

    button { font-family: var(--font); cursor: pointer; }
    input  { font-family: var(--font); }

    /* ============================================================
       3. LAYOUT
    ============================================================ */
    #root { min-height: 100vh; display: flex; flex-direction: column; }

    .app-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 28px;
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
      padding: 28px 28px 72px;
    }

    /* ============================================================
       4. HEADER
    ============================================================ */
    .app-header {
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-brand-icon {
      width: 30px; height: 30px;
      background: var(--primary);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
    }

    .app-title  { font-size: 0.975rem; font-weight: 700; letter-spacing: -0.025em; }
    .app-tagline { font-size: 0.7rem; color: var(--text-3); letter-spacing: 0.07em; text-transform: uppercase; }

    /* ============================================================
       5. MAIN COLUMN
    ============================================================ */
    .main-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

    /* ============================================================
       6. STATS BAR
    ============================================================ */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--border);
      border-radius: var(--r-lg);
      gap: 1px; overflow: hidden;
      border: 1px solid var(--border);
    }

    .stat-cell { background: var(--surface); padding: 16px 14px 14px; }

    .stat-cell-top {
      display: flex; align-items: center;
      gap: 7px; margin-bottom: 6px;
    }

    .stat-icon { color: var(--text-3); display: flex; align-items: center; }

    .stat-number {
      font-size: 1.85rem; font-weight: 700;
      letter-spacing: -0.04em; line-height: 1;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }

    .stat-number.level  { color: var(--primary-light); }
    .stat-number.xp     { color: var(--text); }
    .stat-number.streak { color: var(--accent); }

    .stat-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-3); }

    /* XP Progress */
    .xp-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px 16px; }

    .xp-bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }

    .xp-bar-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-3); }

    .xp-bar-value { font-size: 0.7rem; color: var(--text-2); font-variant-numeric: tabular-nums; }

    .progress-track { height: 3px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 0;
    }

    /* ============================================================
       7. PANELS
    ============================================================ */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }

    .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 7px; }

    .panel-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); }

    .panel-body { padding: 16px; }

    /* ============================================================
       8. MISSION FORM
    ============================================================ */
    .text-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: var(--r-sm);
      padding: 10px 13px;
      font-size: 0.9rem; color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .text-input:focus   { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .text-input:disabled { opacity: 0.38; cursor: not-allowed; }
    .text-input::placeholder { color: var(--text-3); }

    .char-counter { font-size: 0.65rem; color: var(--text-3); text-align: right; margin-top: 4px; transition: color 0.2s; }
    .char-counter.warn { color: var(--warning); }

    .form-sub-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-3); margin: 14px 0 8px; }

    /* Duration buttons */
    .duration-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }

    .dur-btn {
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: var(--r-sm); padding: 8px 4px;
      font-size: 0.78rem; font-weight: 600; color: var(--text-2);
      transition: all 0.15s;
    }

    .dur-btn:hover:not(:disabled) { border-color: var(--primary-light); color: var(--text); }

    .dur-btn.active { background: rgba(124, 58, 237, 0.18); border-color: var(--primary); color: var(--primary-light); }

    .dur-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Custom time (animated reveal) */
    .custom-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
      overflow: hidden; max-height: 0; opacity: 0;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }

    .custom-row.visible { max-height: 52px; opacity: 1; }

    .custom-input {
      width: 84px;
      background: var(--surface-2); border: 1px solid var(--primary);
      border-radius: var(--r-sm); padding: 8px 10px;
      font-size: 0.875rem; font-variant-numeric: tabular-nums; color: var(--text);
      outline: none; transition: box-shadow 0.2s;
    }

    .custom-input:focus    { box-shadow: 0 0 0 3px var(--primary-glow); }
    .custom-input:disabled { opacity: 0.3; cursor: not-allowed; }

    .custom-hint { font-size: 0.72rem; color: var(--text-3); }

    /* Start button */
    .btn-start {
      width: 100%; background: var(--primary); border: none;
      border-radius: var(--r-sm); padding: 11px 18px;
      color: #fff; font-size: 0.875rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: -0.01em;
      transition: background 0.18s, transform 0.14s, box-shadow 0.18s;
    }

    .btn-start:hover:not(:disabled)  { background: #6D28D9; transform: translateY(-1px); box-shadow: 0 6px 22px rgba(124, 58, 237, 0.4); }
    .btn-start:active:not(:disabled) { transform: translateY(0); }
    .btn-start:disabled               { opacity: 0.32; cursor: not-allowed; }

    /* Inline error */
    .inline-msg { display: none; align-items: center; gap: 8px; padding: 9px 12px; border-radius: var(--r-sm); font-size: 0.78rem; font-weight: 500; margin-bottom: 12px; }
    .inline-msg.show { display: flex; }
    .inline-msg.warning { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.25); color: #FCA5A5; }

    /* ============================================================
       9. ACTIVE TIMER
    ============================================================ */
    .timer-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-left: 2px solid var(--accent);
      border-radius: var(--r-lg); padding: 24px 20px 20px; text-align: center;
    }

    .timer-mission-name { font-size: 0.78rem; color: var(--text-2); font-style: italic; margin-bottom: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .ring-container { position: relative; width: 170px; height: 170px; margin: 0 auto 20px; }

    .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }

    .ring-track    { fill: none; stroke: var(--surface-3); stroke-width: 3; }

    .ring-progress { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.4s ease; }
    .ring-progress.mid { stroke: var(--warning); }
    .ring-progress.low { stroke: var(--danger); }

    .ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }

    .timer-digits { font-family: var(--font-mono); font-size: 3rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; transition: color 0.4s; }
    .timer-sub    { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); margin-top: 5px; }

    .timer-panel.mid .timer-digits { color: var(--warning); }
    .timer-panel.low .timer-digits { color: var(--danger); }

    .btn-abandon {
      width: 100%; background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--r-sm); padding: 9px;
      color: var(--danger); font-size: 0.78rem; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 0.18s, border-color 0.18s;
    }

    .btn-abandon:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); }

    /* ============================================================
       10. COMPLETION
    ============================================================ */
    .completion-panel { background: rgba(6, 214, 160, 0.05); border: 1px solid rgba(6, 214, 160, 0.2); border-radius: var(--r-lg); padding: 16px; }

    .btn-complete {
      width: 100%; background: transparent; border: 1px solid var(--accent);
      border-radius: var(--r-sm); padding: 13px 18px;
      color: var(--accent); font-size: 0.9rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 0.2s, color 0.2s;
      animation: pulse-border 2.2s ease-in-out infinite;
    }

    .btn-complete:hover { background: var(--accent); color: #07070F; animation: none; }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(6, 214, 160, 0.5); }
      50%       { box-shadow: 0 0 0 7px rgba(6, 214, 160, 0); }
    }

    /* ============================================================
       11. HISTORY
    ============================================================ */
    .history-list { list-style: none; display: flex; flex-direction: column; gap: 1px; background: var(--border); }

    .history-item { background: var(--surface); padding: 11px 16px; display: flex; align-items: center; gap: 11px; transition: background 0.15s; }
    .history-item:hover { background: var(--surface-2); }

    .history-dot { width: 26px; height: 26px; border-radius: 6px; background: rgba(124, 58, 237, 0.14); display: flex; align-items: center; justify-content: center; color: var(--primary-light); flex-shrink: 0; }

    .history-info { flex: 1; min-width: 0; }

    .history-text { font-size: 0.845rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .history-meta { font-size: 0.65rem; color: var(--text-3); margin-top: 2px; }

    .history-xp { font-size: 0.72rem; font-weight: 700; color: var(--primary-light); flex-shrink: 0; }

    .empty-history { padding: 26px 16px; text-align: center; color: var(--text-3); font-size: 0.82rem; }

    /* ============================================================
       12. MEDALS SIDEBAR
    ============================================================ */
    .medals-sidebar {
      position: sticky; top: 28px; height: fit-content;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); display: flex; flex-direction: column;
    }

    .medals-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 7px; }

    .medals-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); }

    .medals-badge { margin-left: auto; font-size: 0.65rem; font-weight: 600; color: var(--text-3); background: var(--surface-2); padding: 2px 8px; border-radius: 999px; }

    .medals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-radius: 0 0 var(--r-lg) var(--r-lg); overflow: hidden; }

    .medal-item { position: relative; background: var(--surface); padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 7px; transition: background 0.15s; }
    .medal-item:hover { background: var(--surface-2); }

    .medal-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: box-shadow 0.3s, background 0.3s; }

    .medal-item.locked   .medal-icon { background: var(--surface-3); color: var(--text-3); opacity: 0.55; }
    .medal-item.unlocked .medal-icon { background: rgba(124, 58, 237, 0.18); color: var(--primary-light); box-shadow: 0 0 14px rgba(124, 58, 237, 0.3); }

    .medal-item.unlocked[data-medal="streak_7"] .medal-icon { background: rgba(245, 158, 11, 0.15); color: var(--gold); box-shadow: 0 0 14px rgba(245, 158, 11, 0.25); }
    .medal-item.unlocked[data-medal="xp_1000"]  .medal-icon { background: rgba(6, 214, 160, 0.14); color: var(--accent); box-shadow: 0 0 14px rgba(6, 214, 160, 0.25); }
    .medal-item.unlocked[data-medal="hyperfocus"] .medal-icon { background: rgba(239, 68, 68, 0.13); color: #F87171; box-shadow: 0 0 14px rgba(239, 68, 68, 0.2); }

    .medal-name { font-size: 0.65rem; font-weight: 600; text-align: center; line-height: 1.25; }
    .medal-item.locked   .medal-name { color: var(--text-3); }
    .medal-item.unlocked .medal-name { color: var(--text-2); }

    /* Medal tooltip */
    .medal-tip {
      position: absolute; bottom: calc(100% + 6px); left: 50%;
      transform: translateX(-50%) translateY(5px);
      background: var(--surface-3); border: 1px solid var(--border-2);
      border-radius: var(--r-md); padding: 10px 12px;
      min-width: 160px; max-width: 200px; z-index: 50;
      pointer-events: none; opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }

    .medal-item:hover .medal-tip { opacity: 1; transform: translateX(-50%) translateY(0); }

    .tip-name { font-size: 0.75rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .tip-desc { font-size: 0.67rem; color: var(--text-2); line-height: 1.4; margin-bottom: 8px; }

    .tip-progress-track { height: 3px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 4px; }
    .tip-progress-fill  { height: 100%; border-radius: 999px; background: var(--primary); }

    .medal-item.unlocked .tip-progress-fill { background: var(--accent); }

    .tip-progress-text { font-size: 0.62rem; color: var(--text-3); }

    /* Medal unlock animation */
    @keyframes unlock-pop {
      0%   { transform: scale(0.4); opacity: 0; }
      65%  { transform: scale(1.18); }
      100% { transform: scale(1); opacity: 1; }
    }

    .medal-item.just-unlocked .medal-icon { animation: unlock-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* ============================================================
       13. TOASTS
    ============================================================ */
    .toast-wrap { position: fixed; top: 18px; right: 18px; z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }

    .toast {
      background: var(--surface-2); border: 1px solid var(--border-2); border-radius: var(--r-md);
      padding: 11px 15px; font-size: 0.835rem; font-weight: 500; max-width: 290px;
      display: flex; align-items: center; gap: 9px;
      opacity: 0; transform: translateX(16px);
      transition: opacity 0.28s ease, transform 0.28s ease;
      pointer-events: auto;
    }

    .toast.show { opacity: 1; transform: translateX(0); }

    .toast.success { border-color: rgba(6, 214, 160, 0.3); background: rgba(6, 214, 160, 0.08); }
    .toast.success .t-icon { color: var(--accent); }

    .toast.warning { border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.08); }
    .toast.warning .t-icon { color: var(--danger); }

    .toast.xp { border-color: rgba(124, 58, 237, 0.35); background: rgba(124, 58, 237, 0.12); }
    .toast.xp .t-icon { color: var(--primary-light); }

    /* ============================================================
       14. ANIMATIONS
    ============================================================ */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes number-bump {
      0%   { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .stat-number.bump { animation: number-bump 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* ---- Level-up animations ---- */
    @keyframes level-up-glow {
      0%   { transform: scale(1);    color: var(--primary-light); filter: none; }
      30%  { transform: scale(1.45); color: #fff; filter: drop-shadow(0 0 14px rgba(167,139,250,0.95)); }
      65%  { transform: scale(1.2);  color: var(--primary-light); filter: drop-shadow(0 0 6px rgba(124,58,237,0.5)); }
      100% { transform: scale(1);    color: var(--primary-light); filter: none; }
    }

    .stat-number.level-up-pulse {
      animation: level-up-glow 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Level-up banner overlay */
    .levelup-banner {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -60%) scale(0.75);
      background: linear-gradient(140deg, rgba(124,58,237,0.97) 0%, rgba(79,20,180,0.97) 100%);
      border: 1px solid rgba(167,139,250,0.45);
      border-radius: var(--r-lg);
      padding: 26px 52px;
      text-align: center;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.32s ease, transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 80px rgba(124,58,237,0.45), 0 24px 64px rgba(0,0,0,0.55);
      will-change: transform, opacity;
    }

    .levelup-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .levelup-banner-label {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.2em; color: rgba(255,255,255,0.5); margin-bottom: 8px;
    }

    .levelup-banner-number {
      font-size: 4rem; font-weight: 700; letter-spacing: -0.06em;
      color: #fff; line-height: 1; margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }

    .levelup-banner-sub {
      font-size: 0.75rem; color: rgba(255,255,255,0.6); font-weight: 500;
    }

    .stats-bar, .xp-bar, .panel, .timer-panel, .completion-panel {
      animation: fade-up 0.3s ease-out both;
    }

    /* ============================================================
       15. RESPONSIVE
    ============================================================ */
    @media (max-width: 740px) {
      .app-content { grid-template-columns: 1fr; padding: 18px 14px 56px; gap: 16px; }

<body>

  <!-- Level-up banner overlay -->
  <div class="levelup-banner" id="levelup-banner" aria-hidden="true">

  </div>

  <!-- Toast container -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <!-- Lucide Icons - UMD bundle, all icons included -->
  <script src="./vendor/lucide.min.js"></script>

  <script>
    /* ============================================================
       CONSTANTS
    ============================================================ */
    var STORAGE_KEY        = 'wup_data_v2';
    var SOUND_ENABLED      = true;       // set false to silence level-up sound
    var MAX_MISSION_LEN    = 50;
    var MAX_HISTORY        = 10;
    var RING_RADIUS        = 77;
    var RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS; // ≈ 483.8

    var MSG_SUCCESS = [
      'Â¡MisiÃ³n completada! Eres imparable.',
      'Â¡Excelente! Cada bloque de enfoque cuenta.',
      'Â¡Un paso mÃ¡s hacia la grandeza!',
      'Â¡Lo conseguiste! El hÃ¡bito se construye asÃ­.',
      'Â¡Consistencia es tu superpoder!',
    ];

    var MSG_ABANDON = [
      'MisiÃ³n abandonada. La constancia marca la diferencia.',
      'No pasa nada, vuelve cuando estÃ©s listo.',
    ];

    /* ============================================================
       MEDALS DEFINITION
    ============================================================ */
    var MEDALS = [
      {
        id: 'first_step', name: 'Primer paso',
        desc: 'Completa tu primera misiÃ³n', icon: 'flag',
        check:    function(s) { return s.missions.length >= 1; },
        progress: function(s) { return { curr: Math.min(s.missions.length, 1), total: 1 }; },
      },
      {
        id: 'daily_3', name: 'Enfoque inicial',
        desc: '3 misiones en un mismo dÃ­a', icon: 'zap',
        check:    function(s) { return getMaxMissionsInDay(s) >= 3; },
        progress: function(s) { return { curr: Math.min(getMaxMissionsInDay(s), 3), total: 3 }; },
      },
      {
        id: 'active_5', name: 'Cerebro activo',
        desc: '5 dÃ­as distintos con actividad', icon: 'activity',
        check:    function(s) { return getActiveDays(s) >= 5; },
        progress: function(s) { return { curr: Math.min(getActiveDays(s), 5), total: 5 }; },
      },
      {
        id: 'missions_10', name: 'Disciplina base',
        desc: '10 misiones completadas', icon: 'shield',
        check:    function(s) { return s.missions.length >= 10; },
        progress: function(s) { return { curr: Math.min(s.missions.length, 10), total: 10 }; },
      },
      {
        id: 'hyperfocus', name: 'Hyperfocus',
        desc: 'Completa una misiÃ³n de 25+ min', icon: 'rocket',
        check:    function(s) { return s.missions.some(function(m) { return m.duration >= 25; }); },
        progress: function(s) {
          var n = s.missions.filter(function(m) { return m.duration >= 25; }).length;
          return { curr: Math.min(n, 1), total: 1 };
        },
      },
      {
        id: 'streak_7', name: 'Constancia',
        desc: '7 dÃ­as seguidos con actividad', icon: 'calendar',
        check:    function(s) { return calcStreak(s) >= 7; },
        progress: function(s) { return { curr: Math.min(calcStreak(s), 7), total: 7 }; },
      },
      {
        id: 'xp_1000', name: 'Maestro del enfoque',
        desc: 'Acumula 1000 XP', icon: 'star',
        check:    function(s) { return s.xp >= 1000; },
        progress: function(s) { return { curr: Math.min(s.xp, 1000), total: 1000 }; },
      },
    ];

    /* ============================================================
       APPLICATION STATE
    ============================================================ */
    var state = {
      xp:             0,
      missions:       [],     // { text, duration, timestamp }[]
      unlockedMedals: [],     // string[] medal IDs
      currentMission: null,   // { text, duration, totalSeconds } | null
      timerInterval:  null,
      timeLeft:       0,
      selectedDur:    10,     // number (minutes) or 'custom'
      customDurValue: 30,
    };

    function clampInt(value, min, max, fallback) {
      var n = typeof value === 'number' ? value : parseInt(value, 10);
      if (!Number.isFinite(n)) return fallback;
      n = Math.floor(n);
      if (n < min || n > max) return fallback;
      return n;
    }

    function sanitizeMissionText(raw) {
      if (typeof raw !== 'string') return '';
      return raw
        .replace(/[\u0000-\u001F\u007F-\u009F]/g, ' ')
        .replace(/[<>]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, MAX_MISSION_LEN);
    }

    function sanitizeMissionRecord(mission) {
      if (!mission || typeof mission !== 'object') return null;

      var text = sanitizeMissionText(mission.text);
      var duration = clampInt(mission.duration, 1, 180, null);
      var timestamp = clampInt(mission.timestamp, 0, 4102444800000, null);

      if (!text || duration === null || timestamp === null) return null;
      return { text: text, duration: duration, timestamp: timestamp };
    }

    /* ============================================================
       PERSISTENCE
    ============================================================ */
    function loadData() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var p = JSON.parse(raw);
        if (Array.isArray(p.missions)) {
          state.missions = p.missions
            .map(sanitizeMissionRecord)
            .filter(function(m) { return m !== null; })
            .slice(0, 500);
        }
        state.xp = state.missions.reduce(function(total, mission) {
          return total + mission.duration;
        }, 0);
        state.unlockedMedals = [];
        checkMedals();
      } catch (e) { console.warn('WUP: localStorage parse error â€”', e.message); }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          xp:             state.xp,
          missions:       state.missions,
          unlockedMedals: state.unlockedMedals,
        }));
      } catch (e) { console.warn('WUP: localStorage write error â€”', e.message); }
    }

    /* ============================================================
       PURE LOGIC
    ============================================================ */
    /* --- Level system: mission-count based, exponential threshold ---
       threshold(N) = 1 + (N-1)*N/2
       N=1→1, N=2→2, N=3→4, N=4→7, N=5→11, N=6→16 ... */
    function missionThreshold(level) {
      if (level <= 1) return 1;
      return 1 + Math.floor((level - 1) * level / 2);
    }

    function calculateLevelProgress(missionCount) {
      var mc    = Math.max(missionCount, 0);
      var level = 1;
      while (mc >= missionThreshold(level + 1)) { level++; }
      var currThreshold = missionThreshold(level);
      var nextThreshold = missionThreshold(level + 1);
      var inLevel       = mc - currThreshold;
      var needed        = nextThreshold - currThreshold;
      return {
        level:           level,
        progressPct:     needed > 0 ? Math.min((inLevel / needed) * 100, 100) : 100,
        missionsInLevel: Math.max(inLevel, 0),
        missionsNeeded:  needed,
        missionsToNext:  Math.max(needed - inLevel, 0),
      };
    }

    function detectLevelUp(prevCount, newCount) {
      if (newCount <= prevCount) return 0;
      var prevLevel = 1;
      while (prevCount >= missionThreshold(prevLevel + 1)) { prevLevel++; }
      var newLevel = prevLevel;
      while (newCount >= missionThreshold(newLevel + 1)) { newLevel++; }
      return newLevel > prevLevel ? newLevel : 0;
    }

    function calcStreak(s) {
      s = s || state;
      if (s.missions.length === 0) return 0;
      var dateSet = new Set(s.missions.map(function(m) {
        var d = new Date(m.timestamp);
        return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      }));
      var today    = new Date();
      var todayKey = today.getFullYear() + '-' + today.getMonth() + '-' + today.getDate();
      var check    = new Date(today);
      if (!dateSet.has(todayKey)) check.setDate(check.getDate() - 1);
      var streak = 0;
      while (streak <= 3650) {
        var key = check.getFullYear() + '-' + check.getMonth() + '-' + check.getDate();
        if (!dateSet.has(key)) break;
        streak++;
        check.setDate(check.getDate() - 1);
      }
      return streak;
    }

    function getActiveDays(s) {
      s = s || state;
      return new Set(s.missions.map(function(m) {
        var d = new Date(m.timestamp);
        return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      })).size;
    }

    function getMaxMissionsInDay(s) {
      s = s || state;
      var counts = {};
      s.missions.forEach(function(m) {
        var d = new Date(m.timestamp);
        var k = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        counts[k] = (counts[k] || 0) + 1;
      });
      var vals = Object.keys(counts).map(function(k) { return counts[k]; });
      return vals.length > 0 ? Math.max.apply(null, vals) : 0;
    }

    function checkMedals() {
      var newlyUnlocked = [];
      MEDALS.forEach(function(m) {
        if (state.unlockedMedals.indexOf(m.id) === -1 && m.check(state)) {
          state.unlockedMedals.push(m.id);
          newlyUnlocked.push(m.id);
        }
      });
      return newlyUnlocked;
    }

    function getEffectiveDuration() {
      return state.selectedDur === 'custom' ? state.customDurValue : state.selectedDur;
    }

    /* ============================================================
       TIMER LOGIC
    ============================================================ */
    function startMission() {
      var inputEl = document.getElementById('mission-input');
      var text    = sanitizeMissionText(inputEl.value);
      inputEl.value = text;

      if (text.length === 0) {
        showInlineMsg('Escribe en quÃ© te vas a enfocar antes de empezar.');
        inputEl.focus();
        return;
      }
      if (text.length > MAX_MISSION_LEN) {
        showInlineMsg('La misiÃ³n no puede superar los ' + MAX_MISSION_LEN + ' caracteres.');
        return;
      }
      if (state.selectedDur === 'custom') {
        var cVal = parseInt(document.getElementById('custom-input').value, 10);
        if (isNaN(cVal) || cVal < 1 || cVal > 180) {
          showInlineMsg('Introduce un nÃºmero entre 1 y 180 minutos.');
          document.getElementById('custom-input').focus();
          return;
        }
        state.customDurValue = cVal;
      }

      var dur          = getEffectiveDuration();
      var totalSeconds = dur * 60;

      state.currentMission = { text: text, duration: dur, totalSeconds: totalSeconds };
      state.timeLeft       = totalSeconds;
      state.timerInterval  = setInterval(tickTimer, 1000);

      hideInlineMsg();
      renderUI();
    }

    function tickTimer() {
      state.timeLeft--;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        clearInterval(state.timerInterval);
        state.timerInterval = null;
        renderUI();
        return;
      }
      renderTimerOnly();
    }

    function abandonMission() {
      if (!confirm('Â¿Seguro que quieres abandonar esta misiÃ³n?\nPerderÃ¡s el progreso del temporizador.')) return;
      clearInterval(state.timerInterval);
      state.timerInterval  = null;
      state.currentMission = null;
      state.timeLeft       = 0;
      showToast(MSG_ABANDON[Math.floor(Math.random() * MSG_ABANDON.length)], 'warning');
      renderUI();
    }

    function completeMission() {
      if (!state.currentMission) return;
      var text     = sanitizeMissionText(state.currentMission.text);
      var duration = state.currentMission.duration;

      /* Capture pre-completion state for level-up detection */
      var prevMissionCount = state.missions.length;
      var prevProg         = calculateLevelProgress(prevMissionCount);

      state.missions.unshift({ text: text, duration: duration, timestamp: Date.now() });
      state.xp += duration;
      state.currentMission = null;
      state.timeLeft       = 0;

      var newMissionCount = state.missions.length;
      var levelUp         = detectLevelUp(prevMissionCount, newMissionCount);
      var newMedals       = checkMedals();
      saveData();

      showToast(MSG_SUCCESS[Math.floor(Math.random() * MSG_SUCCESS.length)], 'success');
      showToast('+' + duration + ' XP ganados', 'xp');

      var inputEl = document.getElementById('mission-input');
      inputEl.value = '';
      updateCharCount('');

      renderUI();

      /* Level-up sequence: reset bar to pre-completion pct, then animate */
      if (levelUp) {
        requestAnimationFrame(function() {
          var fill = document.getElementById('progress-fill');
          if (fill) {
            fill.style.transition = 'none';
            fill.style.width = prevProg.progressPct + '%';
          }
          setTimeout(function() {
            playLevelUpAnimation(levelUp);
            playLevelUpSound();
          }, 80);
        });
      }

      /* Animate newly unlocked medals after render */
      if (newMedals.length > 0) {
        setTimeout(function() {
          newMedals.forEach(function(id) {
            var el = document.querySelector('[data-medal="' + id + '"]');
            if (el) {
              el.classList.add('just-unlocked');
              setTimeout(function() { el.classList.remove('just-unlocked'); }, 650);
            }
          });
          var def = MEDALS.filter(function(m) { return m.id === newMedals[0]; })[0];
          if (def) showToast('\u00a1Logro desbloqueado: ' + def.name + '!', 'success');
        }, 350);
      }
    }

    /* ============================================================
       RENDER FUNCTIONS
    ============================================================ */
    function renderUI() {
      var prog   = calculateLevelProgress(state.missions.length);
      var streak = calcStreak();
      var active  = state.currentMission !== null;
      var running = active && state.timeLeft > 0;
      var done    = active && state.timeLeft <= 0;

      /* Stats */
      setTextBumped('stat-level',  prog.level);
      setTextBumped('stat-xp',     state.xp);
      setTextBumped('stat-streak', streak);
      renderXPBar(prog);

      /* Form lock state */
      var disabled = active;
      document.getElementById('mission-input').disabled = disabled;
      document.getElementById('start-btn').disabled     = disabled;
      document.getElementById('custom-input').disabled  = disabled;
      document.querySelectorAll('.dur-btn').forEach(function(b) { b.disabled = disabled; });

      /* Timer panel */
      var timerPanel = document.getElementById('timer-panel');
      if (running) {
        timerPanel.hidden = false;
        document.getElementById('timer-mission-name').textContent =
          '\u201C' + state.currentMission.text + '\u201D';
        renderTimerOnly();
      } else {
        timerPanel.hidden = true;
        timerPanel.classList.remove('mid', 'low');
      }

      /* Completion panel */
      document.getElementById('completion-panel').hidden = !done;

      /* History & medals */
      renderHistory();
      renderMedals();

      /* Re-init Lucide icons */
      initIcons();
    }

    function renderTimerOnly() {
      if (!state.currentMission) return;
      var timeEl = document.getElementById('timer-digits');
      var ringEl = document.getElementById('ring-progress');
      var panel  = document.getElementById('timer-panel');

      timeEl.textContent = formatTime(state.timeLeft);

      var pct    = state.timeLeft / state.currentMission.totalSeconds;
      var offset = RING_CIRCUMFERENCE * (1 - pct);
      ringEl.style.strokeDasharray  = RING_CIRCUMFERENCE;
      ringEl.style.strokeDashoffset = offset;

      /* Urgency color states */
      ringEl.classList.toggle('low', pct < 0.15);
      ringEl.classList.toggle('mid', pct >= 0.15 && pct < 0.35);
      panel.classList.toggle('low', pct < 0.15);
      panel.classList.toggle('mid', pct >= 0.15 && pct < 0.35);
    }

    /* --- renderXPBar: updates progress bar and label (CSS transition handles easing) --- */
    function renderXPBar(prog) {
      var fill  = document.getElementById('progress-fill');
      var label = document.getElementById('xp-bar-value');
      if (!fill || !label) return;
      fill.style.width = prog.progressPct + '%';
      label.textContent =
        prog.missionsInLevel + ' / ' + prog.missionsNeeded +
        ' misiones \u00b7 Nv.' + (prog.level + 1);
    }

    /* --- animateXPChange: JS-driven eased animation (used during level-up sequence) --- */
    function animateXPChange(fill, fromPct, toPct) {
      var startTime = null;
      var duration  = 550;
      function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }
      function step(ts) {
        if (!startTime) startTime = ts;
        var t = Math.min((ts - startTime) / duration, 1);
        fill.style.width = (fromPct + (toPct - fromPct) * easeInOut(t)) + '%';
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    /* --- playLevelUpAnimation: visual sequence on level-up --- */
    function playLevelUpAnimation(level) {
      /* 1. Pulse the level stat number */
      var levelEl = document.getElementById('stat-level');
      if (levelEl) {
        levelEl.classList.remove('level-up-pulse');
        void levelEl.offsetWidth; /* force reflow to restart animation */
        levelEl.classList.add('level-up-pulse');
        setTimeout(function() { levelEl.classList.remove('level-up-pulse'); }, 950);
      }

      /* 2. XP bar: animate fill → 100%, reset to 0, then animate to new progress */
      var fill = document.getElementById('progress-fill');
      if (fill) {
        var fromPct = parseFloat(fill.style.width) || 0;
        fill.style.transition = ''; /* re-enable if was disabled */
        animateXPChange(fill, fromPct, 100);
        setTimeout(function() {
          fill.style.transition = 'none';
          fill.style.width = '0%';
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              fill.style.transition = '';
              var newProg = calculateLevelProgress(state.missions.length);
              animateXPChange(fill, 0, newProg.progressPct);
              var label = document.getElementById('xp-bar-value');
              if (label) {
                label.textContent =
                  newProg.missionsInLevel + ' / ' + newProg.missionsNeeded +
                  ' misiones \u00b7 Nv.' + (newProg.level + 1);
              }
            });
          });
        }, 620);
      }

      /* 3. Show banner overlay */
      var banner = document.getElementById('levelup-banner');
      if (banner) {
        var numEl = document.getElementById('levelup-banner-number');
        if (numEl) numEl.textContent = String(level);
        banner.classList.add('show');
        setTimeout(function() { banner.classList.remove('show'); }, 2400);
      }

      showToast('\u00a1Nivel ' + level + ' alcanzado!', 'xp');
    }

    /* --- playLevelUpSound: ascending arpeggio via Web Audio API --- */
    function playLevelUpSound() {
      if (!SOUND_ENABLED) return;
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        var ctx   = new AudioCtx();
        /* C5 - E5 - G5 - C6 major arpeggio */
        var notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach(function(freq, i) {
          var osc  = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          var t = ctx.currentTime + i * 0.13;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.22, t + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.46);
          osc.start(t);
          osc.stop(t + 0.5);
        });
        setTimeout(function() { try { ctx.close(); } catch (e) {} }, 2500);
      } catch (e) { /* Web Audio not available or blocked by browser */ }
    }

    function renderHistory() {
      var list   = document.getElementById('history-list');
      var recent = state.missions.slice(0, MAX_HISTORY);

      while (list.firstChild) list.removeChild(list.firstChild);

      if (recent.length === 0) {
        var empty       = document.createElement('li');
        empty.className = 'empty-history';
        empty.textContent = 'AÃºn no has completado ninguna misiÃ³n. Â¡Empieza ahora!';
        list.appendChild(empty);
        return;
      }

      recent.forEach(function(mission) {
        var li       = document.createElement('li');
        li.className = 'history-item';

        var dot     = document.createElement('div');
        dot.className = 'history-dot';
        var dotIcon = document.createElement('i');
        dotIcon.setAttribute('data-lucide', 'check');
        dotIcon.setAttribute('style', 'width:13px;height:13px;');
        dot.appendChild(dotIcon);

        var info       = document.createElement('div');
        info.className = 'history-info';

        var textEl       = document.createElement('div');
        textEl.className = 'history-text';
        textEl.textContent = mission.text;

        var meta       = document.createElement('div');
        meta.className = 'history-meta';
        meta.textContent = mission.duration + ' min Â· ' + formatDate(mission.timestamp);

        info.appendChild(textEl);
        info.appendChild(meta);

        var xpBadge       = document.createElement('div');
        xpBadge.className = 'history-xp';
        xpBadge.textContent = '+' + mission.duration + ' XP';

        li.appendChild(dot);
        li.appendChild(info);
        li.appendChild(xpBadge);
        list.appendChild(li);
      });
    }

    function renderMedals() {
      var grid  = document.getElementById('medals-grid');
      var count = state.unlockedMedals.length;
      document.getElementById('medals-badge').textContent = count + ' / ' + MEDALS.length;

      while (grid.firstChild) grid.removeChild(grid.firstChild);

      MEDALS.forEach(function(medal) {
        var unlocked = state.unlockedMedals.indexOf(medal.id) !== -1;
        var prog     = medal.progress(state);

        var item       = document.createElement('div');
        item.className = 'medal-item ' + (unlocked ? 'unlocked' : 'locked');
        item.setAttribute('data-medal', medal.id);

        var iconWrap       = document.createElement('div');
        iconWrap.className = 'medal-icon';

        var iconEl = document.createElement('i');
        iconEl.setAttribute('data-lucide', medal.icon);
        iconEl.setAttribute('style', 'width:19px;height:19px;');
        iconWrap.appendChild(iconEl);

        var nameEl       = document.createElement('div');
        nameEl.className = 'medal-name';
        nameEl.textContent = medal.name;

        item.appendChild(iconWrap);
        item.appendChild(nameEl);
        item.appendChild(buildMedalTip(medal, unlocked, prog));
        grid.appendChild(item);
      });
    }

    function buildMedalTip(medal, unlocked, prog) {
      var tip       = document.createElement('div');
      tip.className = 'medal-tip';
      tip.setAttribute('role', 'tooltip');

      var nameEl       = document.createElement('div');
      nameEl.className = 'tip-name';
      nameEl.textContent = medal.name;

      var descEl       = document.createElement('div');
      descEl.className = 'tip-desc';
      descEl.textContent = medal.desc;

      var track       = document.createElement('div');
      track.className = 'tip-progress-track';

      var fill       = document.createElement('div');
      fill.className = 'tip-progress-fill';
      fill.style.width = (prog.total > 0 ? Math.min((prog.curr / prog.total) * 100, 100) : 0) + '%';
      track.appendChild(fill);

      var progressText       = document.createElement('div');
      progressText.className = 'tip-progress-text';
      progressText.textContent = unlocked ? '\u2713 Desbloqueado' : prog.curr + ' / ' + prog.total;

      tip.appendChild(nameEl);
      tip.appendChild(descEl);
      tip.appendChild(track);
      tip.appendChild(progressText);
      return tip;
    }

    /* ============================================================
       UTILITIES
    ============================================================ */
    function formatTime(seconds) {
      var m = Math.floor(seconds / 60);
      var s = seconds % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function formatDate(ts) {
      var d         = new Date(ts);
      var today     = new Date();
      var yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      var time = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      if (d.toDateString() === today.toDateString())     return 'Hoy ' + time;
      if (d.toDateString() === yesterday.toDateString()) return 'Ayer ' + time;
      return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
    }

    function setTextBumped(id, value) {
      var el = document.getElementById(id);
      if (!el) return;
      if (el.textContent !== String(value)) {
        el.textContent = String(value);
        el.classList.remove('bump');
        void el.offsetWidth; /* trigger reflow */
        el.classList.add('bump');
        setTimeout(function() { el.classList.remove('bump'); }, 350);
      }
    }

    function updateCharCount(val) {
      var el  = document.getElementById('char-count');
      var len = val.length;
      el.textContent = len + ' / ' + MAX_MISSION_LEN;
      el.className   = len >= MAX_MISSION_LEN - 10 ? 'char-counter warn' : 'char-counter';
    }

    function showInlineMsg(text) {
      var span = document.getElementById('inline-msg-text');
      span.textContent = text;
      document.getElementById('inline-msg').className = 'inline-msg warning show';
      clearTimeout(showInlineMsg._t);
      showInlineMsg._t = setTimeout(hideInlineMsg, 5000);
    }

    function hideInlineMsg() {
      document.getElementById('inline-msg').className = 'inline-msg';
    }

    function showToast(text, type) {
      var container = document.getElementById('toast-wrap');

      var toast       = document.createElement('div');
      toast.className = 'toast ' + type;

      var iconWrap       = document.createElement('span');
      iconWrap.className = 't-icon';

      var iconEl = document.createElement('i');
      iconEl.setAttribute('data-lucide',
        type === 'success' ? 'check-circle' : type === 'warning' ? 'alert-triangle' : 'zap');
      iconEl.setAttribute('style', 'width:15px;height:15px;');
      iconWrap.appendChild(iconEl);

      var textEl       = document.createElement('span');
      textEl.textContent = text;

      toast.appendChild(iconWrap);
      toast.appendChild(textEl);
      container.appendChild(toast);

      initIcons();

      requestAnimationFrame(function() {
        requestAnimationFrame(function() { toast.classList.add('show'); });
      });

      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() {
          if (toast.parentNode === container) container.removeChild(toast);
        }, 300);
      }, 3500);
    }

    function initIcons() {
      try {
        if (window.lucide) {
          lucide.createIcons({ attrs: { 'stroke-width': '1.75', 'aria-hidden': 'true' } });
        }
      } catch (e) { /* graceful degradation if CDN unavailable */ }
    }

    /* ============================================================
       EVENT LISTENERS
    ============================================================ */
    function initEvents() {
      document.getElementById('start-btn').addEventListener('click', startMission);

      document.getElementById('mission-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startMission();
      });

      document.getElementById('mission-input').addEventListener('input', function() {
        var safeValue = sanitizeMissionText(this.value);
        if (this.value !== safeValue) this.value = safeValue;
        updateCharCount(this.value);
        hideInlineMsg();
      });

      document.querySelectorAll('.dur-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (this.disabled) return;
          document.querySelectorAll('.dur-btn').forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');

          var dur = this.dataset.duration;
          state.selectedDur = (dur === 'custom') ? 'custom' : parseInt(dur, 10);

          var row = document.getElementById('custom-row');
          if (dur === 'custom') {
            row.classList.add('visible');
            document.getElementById('custom-input').focus();
          } else {
            row.classList.remove('visible');
          }
        });
      });

      document.getElementById('custom-input').addEventListener('input', function() {
        var val = parseInt(this.value, 10);
        if (this.value && /[^\d]/.test(this.value)) {
          this.value = this.value.replace(/[^\d]/g, '');
          val = parseInt(this.value, 10);
        }
        if (!isNaN(val) && val >= 1 && val <= 180) {
          state.customDurValue = val;
          hideInlineMsg();
        }
      });

      document.getElementById('abandon-btn').addEventListener('click', abandonMission);
      document.getElementById('complete-btn').addEventListener('click', completeMission);

      window.addEventListener('beforeunload', function(e) {
        if (state.currentMission && state.timeLeft > 0) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    }

    /* ============================================================
       INITIALIZATION
    ============================================================ */
    function init() {
      loadData();
      initEvents();
      renderUI();
      /* Prime SVG ring */
      var ring = document.getElementById('ring-progress');
      if (ring) {
        ring.style.strokeDasharray  = RING_CIRCUMFERENCE;
        ring.style.strokeDashoffset = RING_CIRCUMFERENCE;
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
